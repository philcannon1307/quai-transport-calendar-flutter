name: Build web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: pubspec needs Dart >=3.5; Flutter 3.35 ships Dart 3.9. Bump on purpose, not by accident.
  FLUTTER_VERSION: "3.35.7"

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter --version
      - name: Pub get
        run: set -o pipefail; mkdir -p logs; flutter pub get 2>&1 | tee logs/pub-get.log

      # Non-blocking: reports findings without failing the build.
      - name: Analyze
        run: set -o pipefail; flutter analyze 2>&1 | tee logs/analyze.log
        continue-on-error: true

      # Test failures are REPORTED (red annotation + summary + full log) but do not stop the web build,
      # so the owner still gets an artifact. Make this blocking again once the suite is green.
      - name: Test
        id: tests
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee logs/test.log
        continue-on-error: true

      - name: Summarise test failures
        if: always()
        run: |
          {
            echo "## Test result: ${{ steps.tests.outcome }}"
            echo '```'
            grep -E "^[0-9:+ -]*\[E\]|Some tests failed|All tests passed|tests passed" logs/test.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.tests.outcome }}" = "failure" ]; then echo "::error::flutter test failed - see build-log artifact (logs/test.log)"; fi

      # config/public-config.json holds PUBLIC values only (Railway URLs). No secrets belong in it.
      - name: Check config points at Railway, not Lovable/Supabase
        run: |
          grep -q "up.railway.app" config/public-config.json || { echo "::error::config/public-config.json has no Railway URL"; exit 1; }
          if grep -Eq "supabase\.co|lovable\.app" config/public-config.json; then echo "::error::old backend URL in config/public-config.json"; exit 1; fi

      - name: Build web
        run: set -o pipefail; flutter build web --release --dart-define-from-file=config/public-config.json 2>&1 | tee logs/build-web.log

      - name: Build output sanity
        run: test -f build/web/index.html && test -f build/web/main.dart.js || { echo "::error::build/web is incomplete"; exit 1; }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14
          if-no-files-found: error

  # Android stub: disabled (if: false). Unsigned build only; enable when the owner wants it. No iOS yet.
  android:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define-from-file=config/public-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-unsigned
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
